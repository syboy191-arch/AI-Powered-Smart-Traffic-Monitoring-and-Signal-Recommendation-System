spring.application.name=backend
server.port=8080

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Traffic Monitor Service Configuration
traffic.python-command=${TRAFFIC_PYTHON_COMMAND:python}
traffic.detector-script=ai-service/detector.py
traffic.timeout-seconds=600
traffic.max-pending-jobs=3
traffic.storage-dir=${java.io.tmpdir}/traffic-monitor
traffic.job-ttl-seconds=3600
traffic.cleanup-interval-ms=60000
